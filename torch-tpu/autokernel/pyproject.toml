[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autokernel"
version = "0.1.0"
description = "Reusable Pallas TPU kernel fusion & in-place Hugging Face model patcher for native torch_tpu."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Rabimba Karanjai" }
]
dependencies = [
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autokernel*"]
