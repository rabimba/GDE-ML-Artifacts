#
# Real Envoy v3 Proxy Configuration for FleetKV GAIE Local Digital Twin.
# Connects envoy.filters.http.ext_proc -> fleetkv-epp:9002 and performs
# dynamic endpoint routing via x-gateway-destination-endpoint (Stage 2 & 3)
# or stateless ROUND_ROBIN fallback across aggregated workers (Stage 1).

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: inference_gateway_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: fleetkv_ingress
                codec_type: AUTO
                stream_idle_timeout: 300s
                route_config:
                  name: inference_routes
                  virtual_hosts:
                    - name: inference_service
                      domains: ["*"]
                      routes:
                        # Stage 2 & Stage 3: GAIE Endpoint Picker directed routing via x-gateway-destination-endpoint
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-gateway-destination-endpoint
                                present_match: true
                          route:
                            cluster: gaie_endpoint_picker_cluster
                            timeout: 0s
                        # Stage 1 Fallback: Standard stateless Kubernetes Service Round-Robin
                        - match:
                            prefix: "/"
                          route:
                            cluster: stage1_agg_round_robin
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: fleetkv_epp_grpc
                        timeout: 15s
                      failure_mode_allow: true
                      message_timeout: 10s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: fleetkv_epp_grpc
      connect_timeout: 3s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: fleetkv_epp_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 172.28.10.50
                      port_value: 9002

    - name: gaie_endpoint_picker_cluster
      connect_timeout: 5s
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      original_dst_lb_config:
        use_http_header: true
        http_header_name: x-gateway-destination-endpoint

    - name: stage1_agg_round_robin
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: stage1_agg_round_robin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 172.28.10.11
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: 172.28.10.12
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: 172.28.10.13
                      port_value: 8000
              - endpoint:
                  address:
                    socket_address:
                      address: 172.28.10.14
                      port_value: 8000
