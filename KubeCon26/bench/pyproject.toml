[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetkv-bench"
version = "1.0.0"
description = "KubeCon 2026 Multi-Agent Fork-Storm Workload & Rich Stage TUI"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "msgpack>=1.1.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0.1",
    "pyzmq>=26.2.0",
    "rich>=13.9.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
