#
# Stage 1 & Stage 2 Data Plane: Aggregated vllm-torchtpu Replicas (2x TP=4 = 8 TPU v6e chips)
# fronted by a standard stateless Kubernetes ClusterIP Service (Stage 1 Round-Robin)
# and also selectable via Naive KV-Sticky InferencePool (Stage 2).

apiVersion: v1
kind: Namespace
metadata:
  name: fleetkv-serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-torchtpu-agg
  namespace: fleetkv-serving
  labels:
    app: vllm-torchtpu-agg
    llm-d.ai/role: agg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-torchtpu-agg
      llm-d.ai/role: agg
  template:
    metadata:
      labels:
        app: vllm-torchtpu-agg
        llm-d.ai/role: agg
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x2
        fleetkv.io/pool: agg
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: hf-cache
          emptyDir:
            sizeLimit: 120Gi
      containers:
        - name: vllm-torchtpu
          image: vllm/vllm-torchtpu:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONHASHSEED
              value: "0"
            - name: PJRT_DEVICE
              value: "TPU"
            - name: VLLM_USE_V1
              value: "1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-hub-secret
                  key: token
                  optional: true
          args:
            - "serve"
            - "Qwen/Qwen3-30B-A3B-FP8"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--tensor-parallel-size"
            - "4"
            - "--block-size"
            - "256"
            - "--max-model-len"
            - "65536"
            - "--gpu-memory-utilization"
            - "0.92"
            - "--enable-prefix-caching"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv-events"}'
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: zmq-kv-events
              containerPort: 5557
              protocol: TCP
          resources:
            requests:
              google.com/tpu: "4"
              cpu: "24"
              memory: "128Gi"
            limits:
              google.com/tpu: "4"
              cpu: "24"
              memory: "128Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-agg-roundrobin-svc
  namespace: fleetkv-serving
  labels:
    app: vllm-torchtpu-agg
spec:
  type: ClusterIP
  selector:
    app: vllm-torchtpu-agg
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-agg-headless-svc
  namespace: fleetkv-serving
  labels:
    app: vllm-torchtpu-agg
spec:
  clusterIP: None
  selector:
    app: vllm-torchtpu-agg
    llm-d.ai/role: agg
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: zmq-kv-events
      port: 5557
      targetPort: 5557
      protocol: TCP
